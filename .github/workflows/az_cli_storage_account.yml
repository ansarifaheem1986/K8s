name: Deploy Azure Storage Account
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: 'Resource Group Name'
        required: true
      subscriptionId:
        description: 'Azure Subscription'
        required: true
        type: choice
        options:
          - Dev
          - Stage
          - Prod
      location:
        description: 'Azure Region'
        required: true
        type: choice
        options:
          - eastus
          - westus
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
 
      - name: Run Azure CLI Script
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            echo "Running Azure CLI commands..."
 
            RESOURCE_GROUP="${{ github.event.inputs.resourceGroup }}"
            LOCATION="${{ github.event.inputs.location }}"
            STORAGE_ACCOUNT="mystorage${{ github.run_id }}"  # Example dynamic name
 
            progress() {
              local percent=$1
              local message=$2
              echo -ne "[$percent%] $message...\n"
            }
 
            progress 5 "Checking Resource Group"
            RG_EXISTS=$(az group exists --name $RESOURCE_GROUP)
            if [ "$RG_EXISTS" = false ]; then
              progress 10 "Creating Resource Group"
              az group create --name $RESOURCE_GROUP --location $LOCATION >/dev/null
            else
              progress 10 "Resource Group already exists"
            fi
            progress 20 "Checking Storage Account"
            SA_EXISTS=$(az storage account show --name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP --query "name" -o tsv 2>/dev/null)
 
            if [ -z "$SA_EXISTS" ]; then
              progress 30 "Creating Storage Account"
              az storage account create \
                --name $STORAGE_ACCOUNT \
                --resource-group $RESOURCE_GROUP \
                --location $LOCATION \
                --sku Standard_LRS \
                --kind StorageV2 \
                --access-tier Hot \
                --https-only true \
                --min-tls-version TLS1_2 \
                --enable-large-file-share \
                --public-network-access Enabled \
                --routing-choice MicrosoftRouting >/dev/null
            else
              progress 30 "Storage Account already exists"
            fi
 
            progress 50 "Configuring Blob soft delete"
            az storage account blob-service-properties update \
              --account-name $STORAGE_ACCOUNT \
              --resource-group $RESOURCE_GROUP \
              --enable-delete-retention true \
              --delete-retention-days 7 >/dev/null
 
            progress 65 "Configuring Container soft delete"
            az storage account blob-service-properties update \
              --account-name $STORAGE_ACCOUNT \
              --resource-group $RESOURCE_GROUP \
              --container-delete-retention-days 7 \
              --enable-container-delete-retention true >/dev/null
 
            progress 80 "Configuring File Share soft delete"
            az storage account file-service-properties update \
              --resource-group $RESOURCE_GROUP \
              --account-name $STORAGE_ACCOUNT \
              --enable-delete-retention true \
              --delete-retention-days 7 >/dev/null
 
            progress 95 "Verifying configuration"
            az storage account show --name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP \
              --query "{name:name, location:primaryLocation, sku:sku.name, kind:kind, enableHttpsTrafficOnly:enableHttpsTrafficOnly, minimumTlsVersion:minimumTlsVersion}" -o table
 
            progress 100 "Storage Account setup completed successfully!"
